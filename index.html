<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom - Secure Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col items-center justify-center p-6 bg-gradient-to-br from-gray-950 via-gray-900 to-black text-white">
  <div class="w-full max-w-md p-8 bg-gray-900/80 backdrop-blur-md rounded-2xl border border-gray-800 shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-4xl font-extrabold tracking-wider text-emerald-500 mb-2">THE VAULT</h1>
      <p class="text-gray-400 text-sm">Enter secure access key</p>
    </div>

    <form id="auth-form" class="space-y-6">
      <div>
        <input
          type="password"
          id="password-input"
          placeholder="Access key..."
          required
          class="w-full px-4 py-3 bg-gray-800/90 border border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
        />
      </div>
      <p id="error-msg" class="text-xs text-red-400 text-center font-medium hidden">Incorrect password. Please try again.</p>
      <button
        type="submit"
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 rounded-lg font-semibold text-white transition-colors duration-200 shadow-lg shadow-emerald-900/20"
      >
        Unlock Vault
      </button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('vault_unlocked') === 'true') {
      window.location.replace('/proxy.html');
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password-input').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem('vault_unlocked', 'true');
          window.location.replace('/proxy.html');
        } else {
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Server connection error.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
