<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Docs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/stealth.js" defer></script>
</head>
<body class="flex flex-col items-center justify-center min-h-screen bg-gray-950 p-6 text-white">
  <div class="max-w-xl w-full p-8 bg-gray-900 rounded-2xl border border-gray-800 shadow-2xl">
    <h1 class="text-3xl font-bold text-center mb-2">Unblockable Web Portal</h1>
    <p class="text-gray-400 text-center text-sm mb-8">Wisp WebSocket Tunnel + Ultraviolet Engine</p>

    <form id="proxy-form" class="space-y-4">
      <input 
        type="text" 
        id="url-input"
        placeholder="Search Google or enter destination URL..."
        class="w-full px-5 py-4 bg-gray-800 rounded-lg text-white border border-gray-700 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all"
        required
      />
      <button 
        type="submit"
        class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold transition-colors shadow-lg shadow-emerald-950/50"
      >
        Launch Stealth Session
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="/games.html" class="text-emerald-400 hover:underline text-sm font-medium">
        Browse Unblocked Games Library →
      </a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('vault_unlocked') !== 'true') {
      window.location.replace('/index.html');
    }

    function encodeUrl(str) {
      return encodeURIComponent(
        str.split('').map((char, ind) => 
          ind % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char
        ).join('')
      );
    }

    document.getElementById('proxy-form').addEventListener('submit', (e) => {
      e.preventDefault();
      let target = document.getElementById('url-input').value.trim();
      if (!/^http(s?):\/\//.test(target)) {
        target = `https://www.google.com/search?q=${target}`;
      }
      const proxiedUrl = `/uv/service/${encodeUrl(target)}`;
      launchStealthMode(proxiedUrl);
    });
  </script>
</body>
</html>
